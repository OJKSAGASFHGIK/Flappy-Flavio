<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Flavio</title>
    
    <link href="./css.css" rel="stylesheet">
    <script type="text/javascript" src="./js.js"></script>
</head>
<body>
    <canvas id="board"></canvas>

    <!-- START BUTTON -->
    <button id="startBtn" class="start-btn">🚀 START</button>

    <!-- GAME OVER WINDOW (hidden by default) -->
    <div id="gameOverWindow" class="gameover-window hide">
        <h2>💩 GAME OVER</h2>
        <p>Flavio se cagou...</p>
        <button id="restartBtn" class="restart-btn">🔄 Tentar dnvo...</button>
    </div>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4362621339142981"
     crossorigin="anonymous"></script>
</body>
</html>
